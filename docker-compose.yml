services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - internal
    profiles: [prod]
    restart: always

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    profiles: [dev]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: businesscenter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      internal:
        aliases:
          - postgres
    profiles: [dev, prod]

  postgres-exposed:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: businesscenter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      internal:
        aliases:
          - postgres
    profiles: [dev]
    restart: always

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - app
    networks:
      internal:
        ipv4_address: 172.18.0.4
    profiles: [prod]
    restart: always

volumes:
  pgdata:
  uploads_data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
